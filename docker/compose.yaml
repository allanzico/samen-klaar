name: samen-klaar-${DEPLOY_ENV:?Set DEPLOY_ENV}

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE}
  environment:
    APP_ENV: ${APP_ENV:?Set APP_ENV}
    APP_ADDR: 0.0.0.0:8080
    APP_CONFIG_FILE: /run/secrets/app.env
    WEB_DIR: /app/dist
  secrets:
    - source: app_config
      target: app.env
  networks: [edge, database]
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  gateway:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ${CADDY_FILE:?Set CADDY_FILE}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, /api, healthcheck]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 30s

  migrate:
    <<: *app
    profiles: [tools]
    command: [migrate]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    shm_size: 128m
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

networks:
  edge:
  database:
    internal: true

volumes:
  # Keep previous volume names so the project rename reuses existing data.
  postgres_data:
    name: relay-${DEPLOY_ENV}_postgres_data
  caddy_data:
    name: relay-${DEPLOY_ENV}_caddy_data
  caddy_config:
    name: relay-${DEPLOY_ENV}_caddy_config

secrets:
  app_config:
    file: ${APP_CONFIG_PATH:?Set APP_CONFIG_PATH}
  postgres_password:
    file: ${POSTGRES_PASSWORD_PATH:?Set POSTGRES_PASSWORD_PATH}
